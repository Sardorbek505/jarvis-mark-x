<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — промо-ролик</title>
<style>
@font-face{font-family:Onest;font-weight:100 900;font-display:block;src:url(fonts/onest-lat.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Onest;font-weight:100 900;font-display:block;src:url(fonts/onest-cyr.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{
  --blue:#024ED8; --yellow:#FFD934; --green:#00AB4C; --pink:#FF9AC4;
  --red:#E4380F; --dark:#131313; --ink:#111; --white:#fff; --mint:#16C45A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;height:100%}
body{display:flex;align-items:center;justify-content:center;font-family:Onest,sans-serif;overflow:hidden}
#stage{position:relative;width:540px;height:960px;overflow:hidden;background:#fff;perspective:1500px;transform-origin:center}
.scene{position:absolute;inset:0;display:none;transform-style:preserve-3d}
.abs{position:absolute}
.center{left:50%;top:50%}

/* ---------- headline ---------- */
.headline{position:absolute;left:-3px;right:0;top:62px;font-weight:800;letter-spacing:-3px;line-height:.9;color:#fff;font-size:76px;white-space:nowrap;z-index:5}
.headline .l2{padding-left:34px}
.headline .w{display:inline-block}

/* ---------- phone ---------- */
.phone{position:absolute;width:280px;height:586px;left:50%;top:50%;margin:-293px 0 0 -140px;border-radius:50px;padding:5px;
  background:linear-gradient(135deg,#f4f4f8 0%,#b9bac6 22%,#eceef3 48%,#9d9eab 76%,#e6e7ee 100%);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.35);transform-style:preserve-3d}
.phone::before{content:"";position:absolute;inset:4px;border-radius:46px;background:#0b0b0e}
.phone .screen{position:absolute;inset:9px;border-radius:41px;overflow:hidden;background:#fff}
.phone .glare{position:absolute;inset:9px;border-radius:41px;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.16) 45%,rgba(255,255,255,0) 60%)}
.sbar{position:absolute;left:0;right:0;top:14px;height:26px;z-index:4}
.sbar .isl{position:absolute;left:50%;top:0;width:82px;height:24px;margin-left:-41px;background:#000;border-radius:14px}
.sbar .lp{position:absolute;left:24px;top:8px;width:30px;height:8px;border:2px solid currentColor;border-radius:6px}
.sbar .rp{position:absolute;right:22px;top:8px;width:38px;height:8px}
.sbar .rp i{position:absolute;top:0;height:8px;border:2px solid currentColor;border-radius:6px}
.sbar .rp i:first-child{left:0;width:8px}
.sbar .rp i:last-child{left:9px;width:29px}
.scr{position:absolute;inset:0;padding:52px 16px 0;color:var(--ink)}
.navt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.5px;margin:6px 0 4px}
.back{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.back::after{content:"";width:6px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateX(1px) rotate(45deg)}
.sub{font-size:10px;font-weight:500;opacity:.8;margin-bottom:10px}
.homebar{position:absolute;bottom:8px;left:50%;width:96px;height:4px;margin-left:-48px;border-radius:3px;background:#111}

/* cards */
.card{border-radius:14px;padding:12px;position:relative;overflow:hidden}
.pop{position:absolute;border-radius:14px;box-shadow:0 22px 34px -14px rgba(0,0,0,.45);transform-style:preserve-3d}
.lbl{font-size:9px;font-weight:600;opacity:.9}
.big{font-size:22px;font-weight:800;letter-spacing:-.8px}
.row{display:flex;align-items:center;gap:8px}
.list .it{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:500;padding:6px 0}
.list .sq{width:18px;height:18px;border-radius:4px;flex:none}
.list .v{margin-left:auto;color:var(--mint);font-weight:600}
.btn{border-radius:10px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff}
.chk{width:14px;height:14px;border:1.6px solid #222;border-radius:3px;flex:none}
.opt{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:500;padding:5px 0}
.pill{position:absolute;display:flex;align-items:center;gap:10px;height:62px;padding:0 26px 0 14px;border-radius:40px;font-weight:600;font-size:21px;letter-spacing:-.4px;box-shadow:0 18px 26px -14px rgba(0,0,0,.35)}
.pill svg{width:42px;height:42px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 11px 0 6px;border-radius:15px;font-size:11px;font-weight:600;margin:4px 2px}
.chip svg{width:19px;height:19px}
.pack{position:absolute;width:250px;height:74px;border-radius:12px;padding:10px 14px;box-shadow:0 20px 30px -14px rgba(0,0,0,.4)}
.pack .s{font-size:9px;font-weight:600;opacity:.9}
.pack .t{font-size:22px;font-weight:700;letter-spacing:-.7px;margin-top:2px}
.pack svg{position:absolute;right:10px;top:10px;width:56px;height:56px}
.mini .pack{position:relative;width:auto;height:52px;padding:7px 10px;margin-bottom:6px;box-shadow:none}
.mini .pack .t{font-size:15px}
.mini .pack .s{font-size:7px}
.mini .pack svg{width:38px;height:38px;top:7px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* =========================================================================
   JARVIS promo — стиль 1:1 с референсом (Moolah): вертикаль 9:16,
   жёсткие смены фона blue/pink/red/yellow/green, 3D-телефоны,
   выпрыгивающие карточки, плоские геометричные иллюстрации.
   Всё детерминировано по времени t → renderFrame(t) для покадрового рендера.
   ========================================================================= */
const C={blue:'#024ED8',yellow:'#FFD934',green:'#00AB4C',pink:'#FF9AC4',red:'#E4380F',dark:'#131313',white:'#FFFFFF',ink:'#111',mint:'#16C45A'};
const DURATION=23.8;

/* ---------- math ---------- */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  lin:p=>p,
  out:p=>1-Math.pow(1-p,3),
  inOut:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  expo:p=>p===1?1:1-Math.pow(2,-10*p),
  back:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},
  spring:p=>p===0?0:p===1?1:Math.pow(2,-9*p)*Math.sin((p*10-.75)*(2*Math.PI)/3.2)+1,
};
/* keyframes: [[t,{props}],...] → interpolated props (ease per segment = kf[i+1][2]) */
function kf(t,frames){
  if(t<=frames[0][0])return {...frames[0][1]};
  for(let i=0;i<frames.length-1;i++){
    const [t0,a]=frames[i],[t1,b,ez]=frames[i+1];
    if(t<=t1){const p=(E[ez||'inOut'])(prog(t,t0,t1));const o={};for(const k in a)o[k]=lerp(a[k],b[k]??a[k],p);return o}
  }
  return {...frames[frames.length-1][1]};
}
const D={x:0,y:0,z:0,s:1,rx:0,ry:0,rz:0,o:1};
function tf(el,p){p={...D,...p};
  el.style.transform=`translate3d(${p.x}px,${p.y}px,${p.z}px) rotateX(${p.rx}deg) rotateY(${p.ry}deg) rotateZ(${p.rz}deg) scale(${p.s})`;
  el.style.opacity=p.o;}

/* ---------- DOM helpers ---------- */
const stage=document.getElementById('stage');
function h(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild}
function add(parent,html){const e=h(html);parent.appendChild(e);return e}

    <circle cx="33" cy="84" r="5" fill="${C.red}" opacity=".55"/><circle cx="87" cy="84" r="5" fill="${C.red}" opacity=".55"/>
    <path d="M52 86Q60 92 68 86" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round" fill="none"/></svg>`,

/* ---------- phone factory ---------- */
function phone(parent,{bg='#fff',sbar='#111',inner=''}={}){
  const p=add(parent,`<div class="phone"><div class="screen" style="background:${bg}">
    <div class="sbar" style="color:${sbar}"><span class="lp"></span><span class="isl"></span><span class="rp"><i></i><i></i></span></div>
    <div class="scr">${inner}</div><div class="homebar" style="background:${sbar}"></div></div><div class="glare"></div></div>`);
  return p;
}

/* ---------- headline with word-by-word pink→white reveal ---------- */
function headline(parent,l1,l2,{color='#fff',hi=C.pink}={}){
  const words=[...l1.split(' ').map(w=>[w,1]),...l2.split(' ').map(w=>[w,2])];
  const el=add(parent,`<div class="headline"><div class="l1"></div><div class="l2"></div></div>`);
  const ws=words.map(([w,l])=>{const s=h(`<span class="w">${w}</span>`);el.querySelector('.l'+l).append(s,' ');return s});
  return {el,update(t,appear,base,hiColor){ /* appear: time each word pops, base: text colour */
    ws.forEach((s,i)=>{const a=appear[i]??0;const vis=t>=a;s.style.visibility=vis?'visible':'hidden';
      const p=prog(t,a,a+.16);s.style.transform=`translateY(${(1-E.out(p))*18}px)`;
      const newest=vis&&(i===ws.length-1?t<a+.3:t<(appear[i+1]??99));
      s.style.color=newest?(hiColor||hi):(base||color);});
  }};
}

function scene(start,end,build){const root=add(stage,`<div class="scene"></div>`);const upd=build(root);scenes.push({start,end,root,upd});}

  const cs=[...el.children];

    const head=lerp(-3,cs.length+4,E.inOut(prog(t,0,.8)));

    tf(el,{s:lerp(1.12,.94,E.out(prog(t,0,.9)))});};
});

/* =========================================================================
   driver
   ========================================================================= */
function renderFrame(t){
  for(const s of scenes){const on=t>=s.start&&t<s.end;s.root.style.display=on?'block':'none';if(on)s.upd(t-s.start);}
}
window.renderFrame=renderFrame;window.DURATION=DURATION;
function fit(){const k=Math.min(innerWidth/540,innerHeight/960);stage.style.transform=`scale(${k})`}
const RENDER=location.search.includes('render');
if(!RENDER){addEventListener('resize',fit);fit();
  document.fonts.ready.then(()=>{const t0=performance.now();(function loop(){renderFrame(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop)})()});
}else renderFrame(0);
</script>
