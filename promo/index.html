<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — промо-ролик</title>
<style>
@font-face{font-family:Onest;font-weight:100 900;font-display:block;src:url(fonts/onest-lat.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Onest;font-weight:100 900;font-display:block;src:url(fonts/onest-cyr.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;height:100%}
body{display:flex;align-items:center;justify-content:center;font-family:Onest,sans-serif;overflow:hidden}
#stage{position:relative;width:540px;height:960px;overflow:hidden;background:#fff;perspective:1600px;transform-origin:center}
.scene{position:absolute;inset:0;display:none;transform-style:preserve-3d}
.abs{position:absolute}

.headline{position:absolute;left:-3px;right:0;top:58px;font-weight:800;letter-spacing:-3px;line-height:.9;color:#fff;font-size:74px;white-space:nowrap;z-index:6}
.headline .l2{padding-left:34px}
.headline .w{display:inline-block}

/* ноутбук: крышка с экраном + корпус */
.laptop{position:absolute;left:50%;top:50%;width:480px;height:330px;margin:-165px 0 0 -240px;transform-style:preserve-3d}
.laptop .lid{position:absolute;left:0;top:0;width:480px;height:314px;border-radius:18px 18px 6px 6px;background:#0b0c0f;
  box-shadow:inset 0 0 0 1.5px #3a3c44, 0 40px 60px -30px rgba(0,0,0,.55)}
.laptop .cam{position:absolute;left:50%;top:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#2a2d35}
.laptop .scr{position:absolute;left:10px;top:13px;width:460px;height:287.5px;overflow:hidden;border-radius:4px;background:#030609}
.laptop .scr img{position:absolute;left:0;top:0;width:100%;height:100%}
.laptop .base{position:absolute;left:-30px;top:312px;width:540px;height:14px;border-radius:2px 2px 16px 16px;
  background:linear-gradient(#e9eaef,#b3b5bf 55%,#8d8f99)}
.laptop .notch{position:absolute;left:50%;top:0;width:80px;height:5px;margin-left:-40px;border-radius:0 0 6px 6px;background:#9c9ea8}
.laptop .glare{position:absolute;left:10px;top:13px;width:460px;height:287.5px;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.07) 48%,rgba(255,255,255,0) 62%)}

/* живая вырезка из кадра (карточка результата, крупный план страницы) */
.lens{position:absolute;overflow:hidden;border-radius:14px;box-shadow:0 26px 40px -16px rgba(0,0,0,.55);background:#030609;transform-style:preserve-3d}
.lens img{position:absolute;left:0;top:0}

.say{position:absolute;display:flex;align-items:center;gap:10px;height:54px;padding:0 22px 0 8px;border-radius:30px;background:#fff;color:#111;
  font-weight:700;font-size:18px;letter-spacing:-.4px;white-space:nowrap;box-shadow:0 16px 26px -12px rgba(0,0,0,.35);z-index:7}
.say .m{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.say .m svg{width:22px;height:22px}
.chip{position:absolute;display:flex;align-items:center;height:40px;padding:0 18px;border-radius:22px;font-weight:700;font-size:15px;letter-spacing:-.2px;white-space:nowrap;z-index:7}
.pill{position:absolute;display:flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 10px;border-radius:30px;font-weight:600;font-size:18px;letter-spacing:-.4px;white-space:nowrap;box-shadow:0 14px 22px -12px rgba(0,0,0,.35)}
.pill svg{width:36px;height:36px;flex:none}
</style>
</head>
<body>
<div id="stage"></div>
<script src="build/assets.js"></script>
<script>
const C={blue:'#024ED8',yellow:'#FFD934',green:'#00AB4C',pink:'#FF9AC4',red:'#E4380F',dark:'#131313',white:'#FFFFFF',ink:'#111',mint:'#16C45A',app:'#030609',teal:'#3fd0bd'};
</script>
<script src="icons.js"></script>
<script>
/* =========================================================================
   JARVIS — промо v2. Стиль — от референса (палитра, жирный гротеск, жёсткие
   смены фона, 3D-устройство с выпрыгивающими элементами). Содержание —
   только настоящее приложение: всё, что на экранах, — кадры живого
   ui.JarvisUI, снятые promo/capture/capture.py (шар, карточки, капсула,
   страницы). Вырезки крупным планом — из тех же живых кадров.
   ========================================================================= */
const DURATION=25.5, FPS=30;
const A=window.ASSETS;
const CARD_X=1234, CARD_Y=142, FRAME_W=1920, FRAME_H=1200;

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const E={lin:p=>p,out:p=>1-Math.pow(1-p,3),inOut:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  expo:p=>p===1?1:1-Math.pow(2,-10*p),back:p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)}};
function kf(t,frames){
  if(t<=frames[0][0])return {...frames[0][1]};
  for(let i=0;i<frames.length-1;i++){const [t0,a]=frames[i],[t1,b,ez]=frames[i+1];
    if(t<=t1){const p=(E[ez||'inOut'])(prog(t,t0,t1));const o={};for(const k in a)o[k]=lerp(a[k],b[k]??a[k],p);return o}}
  return {...frames[frames.length-1][1]};
}
const D0={x:0,y:0,z:0,s:1,rx:0,ry:0,rz:0,o:1};
function tf(el,p){p={...D0,...p};el.style.transform=`translate3d(${p.x}px,${p.y}px,${p.z}px) rotateX(${p.rx}deg) rotateY(${p.ry}deg) rotateZ(${p.rz}deg) scale(${p.s})`;el.style.opacity=p.o}

const stage=document.getElementById('stage');
function h(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild}
function add(p,html){const e=h(html);p.appendChild(e);return e}

/* ---------- кадры живого приложения ---------- */
const pending=[];
function setSrc(img,url){if(img._u!==url){img._u=url;img.src=url;pending.push(img)}}
function frameUrl(seq,i){const n=A.seq[seq];i=Math.max(0,Math.min(n-1,Math.floor(i)));
  const ext=seq.startsWith('island')?'png':'jpg';return `build/cap/${seq}/${String(i).padStart(4,'0')}.${ext}`}
function laptop(parent){
  const el=add(parent,`<div class="laptop"><div class="lid"><span class="cam"></span><div class="scr"><img></div><div class="glare"></div></div><div class="base"><span class="notch"></span></div></div>`);
  el.img=el.querySelector('.scr img');return el}
/* вырезка прямоугольника rect=[x,y,w,h] кадра, ширина на сцене dw */
function lens(parent,dw,rect){const el=add(parent,`<div class="lens"><img></div>`);el.img=el.querySelector('img');el.set=r=>{
    const k=dw/r[2];el.style.width=dw+'px';el.style.height=r[3]*k+'px';el.style.left=(270-dw/2)+'px';el.style.top=(480-r[3]*k/2)+'px';
    Object.assign(el.img.style,{width:FRAME_W*k+'px',height:FRAME_H*k+'px',left:-r[0]*k+'px',top:-r[1]*k+'px'})};
  if(rect)el.set(rect);return el}
const cardRect=name=>[CARD_X,CARD_Y,A.cards[name][0],A.cards[name][1]];

/* ---------- текстовые элементы в стиле референса ---------- */
const micSvg=c=>`<svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4" fill="${c}"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
function say(parent,text,accent=C.pink){return add(parent,`<div class="say"><span class="m" style="background:${accent}">${micSvg('#fff')}</span>«${text}»</div>`)}
function headline(parent,l1,l2){
  const words=[...l1.split(' ').map(w=>[w,1]),...l2.split(' ').map(w=>[w,2])];
  const el=add(parent,`<div class="headline"><div class="l1"></div><div class="l2"></div></div>`);
  const ws=words.map(([w,l])=>{const s=h(`<span class="w">${w}</span>`);el.querySelector('.l'+l).append(s,' ');return s});
  return {el,update(t,appear,base,hi){ws.forEach((s,i)=>{const a=appear[i]??0,vis=t>=a;s.style.visibility=vis?'visible':'hidden';
    s.style.transform=`translateY(${(1-E.out(prog(t,a,a+.16)))*18}px)`;
    const newest=vis&&(i===ws.length-1?t<a+.3:t<(appear[i+1]??99));s.style.color=newest?hi:base})}};
}
const onBg=bg=>bg===C.yellow||bg==='#fff'?C.ink:'#fff';
const hiOn=bg=>bg===C.pink?'#fff':bg===C.yellow?C.blue:C.pink;
function center(el){Object.assign(el.style,{left:0,right:0,margin:'0 auto',width:'max-content',top:'50%',marginTop:-el.style.height||'-25px'})}

/* =========================================================================
   СЦЕНЫ
   ========================================================================= */
const scenes=[];
function scene(start,end,build){const root=add(stage,`<div class="scene" style="display:block"></div>`);scenes.push({start,end,root,upd:build(root)})}

/* A · «Просто скажи «Джарвис»» (0 – 1.3) */
scene(0,1.3,root=>{
  const small=add(root,`<div class="abs" style="left:0;right:0;top:430px;text-align:center;font-weight:700;font-size:30px;letter-spacing:-.8px;color:#fff">${[...'Просто скажи'].map(c=>`<span>${c}</span>`).join('')}</div>`);
  const cs=[...small.children];
  const big=add(root,`<div class="abs" style="left:0;right:0;top:470px;text-align:center;font-weight:800;font-size:96px;letter-spacing:-4px;color:${C.pink}">«Джарвис»</div>`);
  return t=>{stage.style.background=C.dark;
    const head=lerp(-3,cs.length+4,E.inOut(prog(t,0,.6)));
    cs.forEach((c,i)=>c.style.color=(i>head-4&&i<head)?C.pink:'#fff');
    tf(small,{y:lerp(0,-60,E.out(prog(t,.55,.8))),s:lerp(1.08,.96,prog(t,0,1.3))});
    const b=prog(t,.6,.85);tf(big,{s:lerp(.55,1,E.back(b))*lerp(1,1.04,prog(t,.85,1.3)),o:b>0?1:0});
    big.style.color=t<.95?C.pink:'#fff';};
});

/* B · настоящий шар просыпается, капсула «Слушаю» (1.3 – 3.4) */
scene(1.3,3.4,root=>{
  // шар крупно: без карточки центр шара в кадре (1022,579), радиус ≈350
  const orb=add(root,`<div class="abs" style="inset:0;overflow:hidden;background:${C.app}"><img style="position:absolute"></div>`);
  const oi=orb.querySelector('img');
  const isl=add(root,`<div class="abs" style="left:50%;top:0;width:560px;margin-left:-280px"><img style="width:100%"></div>`);
  const ii=isl.querySelector('img');
  const cap=add(root,`<div class="abs" style="left:0;right:0;bottom:92px;text-align:center;color:#fff;font-weight:800;font-size:22px;letter-spacing:6px">JARVIS <span style="font-weight:500;letter-spacing:1px;font-size:13px;color:${C.teal}">MARK X</span></div>`);
  return t=>{stage.style.background=C.app;
    setSrc(oi,frameUrl('wake',8+t*FPS));
    const k=lerp(.86,.98,E.inOut(prog(t,0,2.1)));const cx=1022,cy=579;
    Object.assign(oi.style,{width:FRAME_W*k+'px',left:(270-cx*k)+'px',top:(470-cy*k)+'px'});
    const ip=prog(t,.72,1.05);ii.style.visibility=t>.72?'visible':'hidden';
    setSrc(ii,frameUrl('island_listen',(t-.72)*FPS));
    tf(isl,{y:lerp(-80,70,E.back(ip))});
    tf(cap,{o:prog(t,.2,.5),y:lerp(10,0,E.out(prog(t,.2,.6)))});};
});

/* C · ноутбук: «Какая погода в Ташкенте?» → глобус и карточка (3.4 – 6.0) */
scene(3.4,6.0,root=>{
  const lap=laptop(root);
  const card=lens(root,340,cardRect('weather'));
  const s=say(root,'Какая погода в Ташкенте?',C.blue);center(s);
  return t=>{stage.style.background='#fff';
    setSrc(lap.img,frameUrl('weather',8+t*FPS));
    const P=kf(t,[[0,{s:.72,y:120,rx:14,ry:26,rz:-5}],[.5,{s:1.0,y:150,rx:10,ry:18,rz:-3},'out'],[2.6,{s:1.02,y:150,rx:6,ry:-8,rz:1}]]);
    tf(lap,P);
    const sp=prog(t,.05,.35);tf(s,{y:-250+lerp(30,0,E.back(sp)),s:lerp(.6,1,E.back(sp)),o:clamp(sp*3)});
    setSrc(card.img,frameUrl('weather',8+t*FPS));
    const cp=prog(t,1.05,1.45);
    tf(card,{x:lerp(80,40,E.out(cp))+P.ry*1.2,y:lerp(60,-40,E.back(cp)),z:lerp(0,160,E.out(cp)),rx:P.rx*.6,ry:P.ry*.6,rz:P.rz,s:lerp(.4,1,E.back(cp)),o:clamp(cp*4)});};
});

/* D · «Говоришь — делает.»: вспышки фона, живые команды (6.0 – 10.95) */
const BEATS=[
  ['music','Включи Imagine Dragons',C.blue],
  ['volume','Сделай звук потише',C.pink],
  ['screen','Найди ошибку в коде на экране',C.red],
  ['translate','Переведи на русский',C.yellow],
  ['telegram','Отправь скриншот в Телеграм',C.green],
  ['memory','Запомни: кофе без сахара',C.blue],
  ['timer','Выключи комп через 30 минут',C.pink],
  ['app','Открой Телеграм',C.red],
  ['search','Какой курс доллара?',C.yellow]];
const BEAT=.55;
scene(6.0,6.0+BEATS.length*BEAT,root=>{
  const hl=headline(root,'Говоришь —','делает.');
  const lap=laptop(root);
  const card=lens(root,330,cardRect('music'));
  const says=BEATS.map(([,txt])=>{const e=say(root,txt);center(e);e.style.display='none';return e});
  return t=>{
    const bi=Math.min(BEATS.length-1,Math.floor(t/BEAT)),lt=t-bi*BEAT,[seq,,bg]=BEATS[bi];
    stage.style.background=bg;
    hl.update(t,[.05,.3,.55],onBg(bg),hiOn(bg));
    const f=36+lt*FPS*1.6;
    setSrc(lap.img,frameUrl(seq,f));
    const kick=1+.04*(1-E.out(prog(lt,0,.18)));
    tf(lap,{y:215,s:1.06*kick,rx:4,ry:lerp(-6,6,t/5),rz:0});
    says.forEach((e,i)=>e.style.display=i===bi?'flex':'none');
    const sp=prog(lt,0,.14);tf(says[bi],{y:-120+lerp(20,0,E.back(sp)),s:lerp(.7,1,E.back(sp))});
    card.set(cardRect(seq));setSrc(card.img,frameUrl(seq,f));
    const cp=prog(lt,.06,.26);tf(card,{x:70,y:lerp(170,40,E.back(cp)),z:120,s:lerp(.5,1,E.back(cp)),rz:lerp(-4,-1.5,cp),o:clamp(cp*4)});};
});

/* E · «Всё в одном окне»: живые страницы приложения (10.95 – 15.35) */
const PAGES=[
  {seq:'tour',from:0,speed:2.6,dur:1.2,bg:'#fff',label:'Команды · Учёба · Футбол · Контакты',lens:null},
  {seq:'page_study',from:26,speed:1,dur:1.1,bg:C.blue,label:'Учёба: пары и дедлайны',lens:[150,160,1760,470]},
  {seq:'page_commands',from:12,speed:1.2,dur:1.1,bg:C.yellow,label:'Свои команды: фраза → шаги',lens:[570,170,1340,700]},
  {seq:'page_contacts',from:22,speed:1.3,dur:1.0,bg:C.pink,label:'Контакты: «напиши маме»',lens:[100,330,1100,420]}];
scene(10.95,15.35,root=>{
  const hl=headline(root,'Всё в одном','окне');
  const lap=laptop(root);
  const zoom=lens(root,460,[0,0,100,100]);
  const chips=PAGES.map(p=>{const e=add(root,`<div class="chip" style="background:${p.bg==='#fff'?C.ink:'#fff'};color:${p.bg==='#fff'?'#fff':C.ink}">${p.label}</div>`);center(e);e.style.display='none';return e});
  const starts=[];let acc=0;PAGES.forEach(p=>{starts.push(acc);acc+=p.dur});
  return t=>{
    let pi=0;for(let i=0;i<PAGES.length;i++)if(t>=starts[i])pi=i;
    const p=PAGES[pi],lt=t-starts[pi];stage.style.background=p.bg;
    hl.el.style.display=pi>0?'block':'none';hl.update(t,[1.2,1.45,1.7],onBg(p.bg),hiOn(p.bg));
    const f=p.from+lt*FPS*p.speed;setSrc(lap.img,frameUrl(p.seq,f));
    const L=pi===0?kf(lt,[[0,{s:.8,y:40,rx:12,ry:-24,rz:4}],[1.2,{s:1.05,y:30,rx:6,ry:-6,rz:1}]])
                  :{s:1.04*(1+.04*(1-E.out(prog(lt,0,.18)))),y:250,rx:4,ry:lerp(6,-6,lt),rz:0};
    tf(lap,L);
    chips.forEach((c,i)=>c.style.display=i===pi?'flex':'none');
    const cp=prog(lt,0,.16);tf(chips[pi],{y:(pi===0?-230:40)+lerp(16,0,E.back(cp)),s:lerp(.7,1,E.back(cp))});
    zoom.style.display=p.lens?'block':'none';
    if(p.lens){zoom.set(p.lens);setSrc(zoom.img,frameUrl(p.seq,f));
      const zp=prog(lt,.08,.34);tf(zoom,{y:lerp(160,-100,E.back(zp)),z:120,s:lerp(.5,1,E.back(zp)),rz:lerp(3,1,zp),o:clamp(zp*4)});}
  };
});

/* F · капсула: окно свёрнуто — Джарвис рядом (15.35 – 18.85) */
const ISLW=[780,600,560,720];
const ISL=[['island_listen','Слушает',C.blue,0],['island_reply','Отвечает',C.pink,4],['island_music','Что играет',C.yellow,0],['island_match','Счёт матча',C.green,30]];
scene(15.35,18.85,root=>{
  const hl=headline(root,'Свернул окно?','Я рядом.');
  const box=add(root,`<div class="abs" style="left:50%;top:430px;width:600px;margin-left:-300px"><img style="width:100%;display:block"></div>`);
  const im=box.querySelector('img');
  const chips=ISL.map(([,l])=>{const e=add(root,`<div class="chip" style="background:#fff;color:${C.ink}">${l}</div>`);center(e);e.style.display='none';return e});
  const seg=3.5/ISL.length;
  return t=>{const i=Math.min(ISL.length-1,Math.floor(t/seg)),lt=t-i*seg,[seq,,bg,from]=ISL[i];
    stage.style.background=bg;hl.update(t,[.05,.3,.55,.8],onBg(bg),hiOn(bg));
    box.style.width=ISLW[i]+'px';box.style.marginLeft=-ISLW[i]/2+'px';
    setSrc(im,frameUrl(seq,from+lt*FPS*1.4));
    tf(box,{s:(1+.05*(1-E.out(prog(lt,0,.2))))*(1+.05*lt),y:(i===0?lerp(-60,0,E.back(prog(t,0,.35))):0)+Math.sin(t*3.2)*6,rz:Math.sin(t*2.1)*1.2});
    setSrc(im,frameUrl(seq,from+Math.min(lt*FPS*1.4,A.seq[seq]-1)));
    chips.forEach((c,j)=>c.style.display=j===i?'flex':'none');
    tf(chips[i],{y:180+lerp(16,0,E.back(prog(lt,0,.15)))});};
});

/* G · 38 навыков — все из main.py (18.85 – 21.85) */
const SKILLS=[['Погода','weather'],['Музыка','music'],['YouTube','yt'],['Фильмы','film'],['Окна','win'],['Файлы','folder'],['Перевод','globe'],
  ['Зрение','eye'],['Память','brain'],['Obsidian','books'],['Календарь','cal'],['Будильник','alarm'],['Перерывы','cup'],['Футбол','ball'],
  ['Звонки','phone'],['Telegram','plane'],['Свои команды','cmd'],['Голос из фильма','voice'],['Громкость','vol'],['Учёба','bulb']];
scene(18.85,21.85,root=>{
  const cols=[[C.blue,'#fff'],['#fff',C.ink],[C.pink,C.ink],[C.yellow,C.ink],[C.red,'#fff'],[C.ink,'#fff'],[C.green,'#fff']];
  const pills=SKILLS.map(([t,ic],i)=>{const [bg,fg]=cols[i%cols.length];
    const e=add(root,`<div class="pill" style="background:${bg};color:${fg};${bg===C.ink?`box-shadow:0 0 0 3px ${C.mint}`:''}">${I[ic]()}${t}</div>`);
    const row=Math.floor(i/2),col=i%2;e._x=col?290+((row*37)%40):20+((row*53)%60);e._y=90+row*80;e._r=((i*47)%30)-15;e.style.left=e._x+'px';e.style.top=e._y+'px';return e});
  const big=add(root,`<div class="abs" style="left:0;right:0;top:360px;text-align:center;color:${C.ink};z-index:8">
    <div style="font-weight:800;font-size:150px;letter-spacing:-8px;line-height:1">38</div><div style="font-weight:800;font-size:44px;letter-spacing:-1.5px">навыков</div>
    <div style="font-weight:500;font-size:16px;margin-top:8px;opacity:.7">и все — голосом</div></div>`);
  return t=>{stage.style.background='#fff';
    pills.forEach((e,i)=>{const d=(i%10)*.05+Math.floor(i/10)*.02;const k=E.back(prog(t,d,d+.4));
      const out=E.inOut(prog(t,1.75,2.2));
      tf(e,{s:lerp(.3,1,k)*(1-out*.5),rz:e._r*(.4+.6*(1-k))+Math.sin(t*3+i)*2,y:lerp(40,0,k)+Math.sin(t*4+i)*4-out*(e._y<480?600:-600)*.8,o:clamp(k*3)*(1-out)})});
    const bp=prog(t,2.0,2.35);tf(big,{s:lerp(.5,1,E.back(bp))*(1+.08*prog(t,2.35,3)),rz:lerp(-3,0,E.out(bp)),o:bp>0?1:0});};
});

/* H · финал: настоящая иконка, Windows, свой бесплатный ключ (21.85 – 25.5) */
scene(21.85,25.5,root=>{
  const g=add(root,`<div class="abs" style="left:0;right:0;top:330px;display:flex;flex-direction:column;align-items:center">
    <img class="ic" src="../assets/art/icon/icon_1024.png" style="width:170px;height:170px;border-radius:40px;box-shadow:0 24px 40px -18px rgba(0,0,0,.5)">
    <div class="t1" style="margin-top:26px;font-weight:800;font-size:56px;letter-spacing:-2px;color:#fff;line-height:1">JARVIS <span style="font-weight:600;font-size:30px;letter-spacing:0">Mark X</span></div>
    <div class="t2" style="margin-top:12px;font-weight:600;font-size:21px;color:#fff">Голосовой ИИ-ассистент для Windows</div>
    <div class="t3" style="margin-top:26px;display:flex;gap:8px">
      <span style="background:#fff;color:${C.ink};border-radius:20px;padding:9px 16px;font-weight:700;font-size:14px">Бесплатно</span>
      <span style="background:${C.pink};color:${C.ink};border-radius:20px;padding:9px 16px;font-weight:700;font-size:14px">Свой ключ Gemini</span>
      <span style="background:${C.yellow};color:${C.ink};border-radius:20px;padding:9px 16px;font-weight:700;font-size:14px">Установка в 1 клик</span></div></div>`);
  const ic=g.querySelector('.ic'),t1=g.querySelector('.t1'),t2=g.querySelector('.t2'),t3=g.querySelector('.t3');
  return t=>{const end=t>3.45;stage.style.background=end?'#000':C.blue;g.style.display=end?'none':'flex';
    tf(ic,{s:E.back(prog(t,0,.4)),rz:lerp(-20,0,E.out(prog(t,0,.5)))});
    t1.style.color=t<.55?C.pink:'#fff';tf(t1,{o:prog(t,.15,.25),y:lerp(14,0,E.out(prog(t,.15,.45)))});
    tf(t2,{o:prog(t,.4,.55),y:lerp(10,0,E.out(prog(t,.4,.7)))});
    tf(t3,{o:prog(t,.65,.8),s:lerp(.8,1,E.back(prog(t,.65,.95)))});
    tf(g,{s:lerp(1,1.08,prog(t,0,2.6))*lerp(1,.9,E.inOut(prog(t,2.6,3.45))),y:Math.sin(t*2)*4});
    tf(ic,{s:E.back(prog(t,0,.4)),rz:lerp(-20,0,E.out(prog(t,0,.5)))+Math.sin(t*2.4)*3});};
});

/* ---------- driver ---------- */
function renderFrame(t){
  pending.length=0;
  for(const s of scenes){const on=t>=s.start&&t<s.end;s.root.style.display=on?'block':'none';if(on)s.upd(t-s.start)}
  return Promise.all(pending.map(i=>i.decode().catch(()=>{})));
}
window.renderFrame=renderFrame;window.DURATION=DURATION;
function fit(){const k=Math.min(innerWidth/540,innerHeight/960);stage.style.transform=`scale(${k})`}
if(!location.search.includes('render')){addEventListener('resize',fit);fit();
  document.fonts.ready.then(()=>{const t0=performance.now();(function loop(){renderFrame(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop)})()});
}else renderFrame(0);
</script>
