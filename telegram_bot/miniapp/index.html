<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#030609">
    <meta name="color-scheme" content="dark">
    <title>J.A.R.V.I.S</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<div id="app">

    <header>
        <div class="brand">
            <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/>
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
            </svg>
            <span id="screen-title">J.A.R.V.I.S</span>
        </div>
        <div id="indicators">
            <button id="voice-toggle" class="icon-btn" aria-label="Голос ответа: вкл/выкл" title="Голос включён">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/>
                    <line class="slash" x1="22" y1="2" x2="2" y2="22"/>
                </svg>
            </button>
            <div id="pc-badge" class="badge" title="ПК: офлайн"><i></i>ПК</div>
            <div id="conn-badge" class="badge" title="Сервер"><i></i>СЕТЬ</div>
        </div>
    </header>

    <main id="views">

        <!-- ── Джарвис: шар, субтитры, разговор ────────────────────── -->
        <section class="view active is-empty" id="view-chat">
            <div id="stage">
                <canvas id="orb-canvas" role="button" tabindex="0"
                        aria-label="Голос: зажми — говори, тап — режим диалога"></canvas>
                <div id="state-pill"><i></i><span>ЗАПУСК</span></div>
                <div id="subtitle" aria-live="polite"></div>
                <div id="orb-hint">Зажми шар — говори · тап — диалог</div>
                <button id="focus-btn" class="icon-btn" aria-label="Режим шара: спрятать чат">
                    <svg class="to-focus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                    <svg class="to-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </button>
            </div>

            <div id="chat"><div id="messages" aria-live="polite"></div></div>

            <div id="chips">
                <button class="chip" data-say="Какая сегодня погода?">Погода</button>
                <button class="chip" data-say="Что у меня сегодня по планам?">Мои планы</button>
                <button class="chip" data-say="Что ты обо мне знаешь?">Что ты знаешь обо мне</button>
                <button class="chip" data-say="скриншот">Скриншот ПК</button>
                <button class="chip" data-say="Напомни через час сделать перерыв">Напомнить</button>
            </div>

            <div id="input-bar">
                <button id="mic-btn" class="round-btn" aria-label="Голос: зажми — говори, тап — диалог">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
                    </svg>
                </button>
                <input id="text-in" type="text" placeholder="Скажи или напиши Джарвису…"
                       autocomplete="off" autocorrect="on" autocapitalize="sentences" enterkeyhint="send">
                <button id="send-btn" class="round-btn primary" aria-label="Отправить" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
                    </svg>
                </button>
            </div>
        </section>

        <!-- ── Сводка ─────────────────────────────────────────────────── -->
        <section class="view" id="view-dashboard">
            <div class="view-body" id="dash-body"><div class="loading">Загрузка…</div></div>
        </section>

        <!-- ── Дела ───────────────────────────────────────────────────── -->
        <section class="view" id="view-tasks">
            <form class="add-row" onsubmit="event.preventDefault(); addTaskOrReminder()">
                <input id="task-in" type="text" placeholder="Задача или «напомни в 15:00 …»" autocomplete="off" enterkeyhint="done">
                <button class="add-btn" aria-label="Добавить">+</button>
            </form>
            <div class="view-body" id="tasks-body"><div class="loading">Загрузка…</div></div>
        </section>

        <!-- ── Привычки ───────────────────────────────────────────────── -->
        <section class="view" id="view-habits">
            <form class="add-row" onsubmit="event.preventDefault(); addHabit()">
                <input id="habit-in" type="text" placeholder="Новая привычка: вода, спорт, чтение…" autocomplete="off" enterkeyhint="done">
                <button class="add-btn" aria-label="Добавить">+</button>
            </form>
            <div class="view-body" id="habits-body"><div class="loading">Загрузка…</div></div>
        </section>

        <!-- ── ПК-пульт ───────────────────────────────────────────────── -->
        <section class="view" id="view-pc">
            <div class="view-body" id="pc-body">
                <div id="pc-status" class="panel">
                    <div class="pc-status-row">
                        <span class="pulse"></span>
                        <div>
                            <div class="pc-status-title">ПК офлайн</div>
                            <div class="pc-status-sub">Команды выполнятся, когда компьютер будет на связи</div>
                        </div>
                    </div>
                    <button class="pc-launch" data-cmd="запусти джарвис на пк">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                        Запустить Джарвиса на ПК
                    </button>
                </div>

                <div class="group-label">Экран</div>
                <div class="pc-grid">
                    <button class="pc-tile" data-cmd="разблокируй экран"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>Разблок.</button>
                    <button class="pc-tile" data-cmd="заблокируй"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Блокировка</button>
                    <button class="pc-tile" data-cmd="нажми enter"><svg viewBox="0 0 24 24"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>Enter</button>
                    <button class="pc-tile" data-cmd="рабочий стол"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>Рабочий стол</button>
                </div>

                <div class="group-label">Снимки</div>
                <div class="pc-grid">
                    <button class="pc-tile" data-cmd="скриншот"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Скриншот</button>
                    <button class="pc-tile" data-cmd="снимок с камеры"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Камера</button>
                    <button class="pc-tile" data-cmd="скриншот в телеграм"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>Скрин в TG</button>
                    <button class="pc-tile" data-cmd="камера в телеграм"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/><circle cx="6" cy="18" r="2"/></svg>Фото в TG</button>
                </div>

                <div class="group-label">Медиа</div>
                <div class="media-bar panel">
                    <button class="media-btn" data-cmd="предыдущий трек" aria-label="Назад"><svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20" class="fill"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
                    <button class="media-btn big" data-cmd="стоп" aria-label="Пауза"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" class="fill"/><rect x="14" y="4" width="4" height="16" class="fill"/></svg></button>
                    <button class="media-btn" data-cmd="переключи музыку" aria-label="Дальше"><svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" class="fill"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
                    <span class="media-sep"></span>
                    <button class="media-btn" data-cmd="тише" aria-label="Тише"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="16" y1="12" x2="21" y2="12"/></svg></button>
                    <button class="media-btn" data-cmd="громче" aria-label="Громче"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="16" y1="12" x2="22" y2="12"/><line x1="19" y1="9" x2="19" y2="15"/></svg></button>
                </div>
                <div class="pc-grid two">
                    <button class="pc-tile wide" data-cmd="включи музыку"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Включить музыку</button>
                    <button class="pc-tile wide" data-cmd="брифинг"><svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>Брифинг</button>
                </div>

                <div class="group-label">Система</div>
                <div class="pc-grid two">
                    <button class="pc-tile wide" data-cmd="системная информация"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>Состояние ПК</button>
                    <button class="pc-tile wide" data-say="Что сейчас на экране моего компьютера?"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Что на экране?</button>
                </div>
            </div>
        </section>
    </main>

    <div id="toast-container" aria-live="polite"></div>

    <nav id="tabbar">
        <button class="tab active" data-tab="chat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" class="fill"/></svg><span>Джарвис</span></button>
        <button class="tab" data-tab="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg><span>Сводка</span></button>
        <button class="tab" data-tab="tasks"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Дела</span></button>
        <button class="tab" data-tab="habits"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5"/></svg><span>Привычки</span></button>
        <button class="tab" data-tab="pc"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>ПК</span></button>
    </nav>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="orb.js?v=1"></script>
<script src="app.js?v=20"></script>
</body>
</html>
