<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07070f">
    <meta name="color-scheme" content="dark">
    <title>JARVIS</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div id="app">

        <!-- Header (shared) -->
        <header>
            <div id="screen-title">💬 Чат</div>
            <div id="indicators">
                <button id="voice-toggle" class="badge" title="Голос включён" aria-label="Голос вкл/выкл">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/>
                        <line class="slash" x1="22" y1="2" x2="2" y2="22"/>
                    </svg>
                </button>
                <div id="pc-badge" class="badge" title="Desktop JARVIS">
                    <span class="dot" id="pc-dot"></span> ПК
                </div>
                <div id="conn-badge" class="badge" title="Сервер">
                    <span class="dot" id="conn-dot"></span> AI
                </div>
            </div>
        </header>

        <main id="views">

            <!-- ── Чат ─────────────────────────────────────── -->
            <section class="view active is-empty" id="view-chat">
                <div id="chat"><div id="messages"></div></div>

                <div id="orb-section">
                    <div id="orb" class="idle" role="button" tabindex="0"
                         aria-label="Голосовой ввод: зажми чтобы говорить, тап для режима диалога">
                        <div class="ring r1"></div>
                        <div class="ring r2"></div>
                        <div class="ring r3"></div>
                        <div id="core"></div>
                    </div>
                    <div id="orb-label" aria-live="polite">Нажми чтобы говорить</div>
                </div>

                <div id="input-bar">
                    <input id="text-in" type="text" placeholder="Напиши JARVIS..."
                           autocomplete="off" autocorrect="off" autocapitalize="off">
                    <button id="mic-btn" aria-label="Голос: зажми чтобы говорить, тап — диалог">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="2" width="6" height="12" rx="3"/>
                            <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="22"/>
                        </svg>
                    </button>
                    <button id="send-btn" aria-label="Отправить">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </section>

            <!-- ── Сводка (Dashboard) ──────────────────────── -->
            <section class="view" id="view-dashboard">
                <div class="view-body" id="dash-body">
                    <div class="loading">Загрузка…</div>
                </div>
            </section>

            <!-- ── Дела (tasks + reminders) ────────────────── -->
            <section class="view" id="view-tasks">
                <div class="add-row">
                    <input id="task-in" type="text" placeholder="Новая задача или «напомни в 15:00 …»"
                           autocomplete="off">
                    <button class="add-btn" onclick="addTaskOrReminder()">+</button>
                </div>
                <div class="view-body" id="tasks-body">
                    <div class="loading">Загрузка…</div>
                </div>
            </section>

            <!-- ── Привычки ────────────────────────────────── -->
            <section class="view" id="view-habits">
                <div class="add-row">
                    <input id="habit-in" type="text" placeholder="Новая привычка (пить воду, спорт…)"
                           autocomplete="off">
                    <button class="add-btn" onclick="addHabit()">+</button>
                </div>
                <div class="view-body" id="habits-body">
                    <div class="loading">Загрузка…</div>
                </div>
            </section>

            <!-- ── ПК-пульт ────────────────────────────────── -->
            <section class="view" id="view-pc">
                <div class="view-body" id="pc-body">
                    <button class="pc-launch" onclick="pcCmd('запусти джарвис на пк')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
                        Запустить JARVIS на ПК
                    </button>
                    <div class="pc-grid">
                        <button class="pc-tile" onclick="pcCmd('скриншот')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Скриншот</button>
                        <button class="pc-tile" onclick="pcCmd('снимок с камеры')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Камера</button>
                        <button class="pc-tile" onclick="pcCmd('системная информация')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>Система</button>
                        <button class="pc-tile" onclick="pcCmd('рабочий стол')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>Рабочий стол</button>
                        <button class="pc-tile" onclick="pcCmd('включи музыку')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Музыка</button>
                        <button class="pc-tile" onclick="pcCmd('стоп')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>Пауза</button>
                        <button class="pc-tile" onclick="pcCmd('переключи музыку')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>Дальше</button>
                        <button class="pc-tile" onclick="pcCmd('предыдущий трек')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>Назад</button>
                        <button class="pc-tile" onclick="pcCmd('громче')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>Громче</button>
                        <button class="pc-tile" onclick="pcCmd('тише')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>Тише</button>
                        <button class="pc-tile" onclick="pcCmd('заблокируй')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Блокировка</button>
                        <button class="pc-tile" onclick="pcCmd('брифинг')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>Брифинг</button>
                    </div>
                    <div class="pc-hint">Команды уходят на твой ПК, когда он онлайн</div>
                </div>
            </section>

        </main>

        <!-- Bottom tab bar — floating pill, neon active icon + dot indicator -->
        <nav id="tabbar">
            <button class="tab active" data-tab="chat" onclick="switchTab('chat')" aria-label="Чат">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg><i class="dot"></i>
            </button>
            <button class="tab" data-tab="dashboard" onclick="switchTab('dashboard')" aria-label="Сводка">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
                </svg><i class="dot"></i>
            </button>
            <button class="tab" data-tab="tasks" onclick="switchTab('tasks')" aria-label="Дела">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg><i class="dot"></i>
            </button>
            <button class="tab" data-tab="habits" onclick="switchTab('habits')" aria-label="Привычки">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                    <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg><i class="dot"></i>
            </button>
            <button class="tab" data-tab="pc" onclick="switchTab('pc')" aria-label="ПК">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
                </svg><i class="dot"></i>
            </button>
        </nav>

    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
