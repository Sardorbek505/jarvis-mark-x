<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07070f">
    <meta name="color-scheme" content="dark">
    <title>JARVIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">

        <!-- Header (shared) -->
        <header>
            <div id="screen-title">💬 Чат</div>
            <div id="indicators">
                <button id="voice-toggle" class="badge" title="Голос включён">🔊</button>
                <div id="pc-badge" class="badge" title="Desktop JARVIS">
                    <span class="dot" id="pc-dot"></span> ПК
                </div>
                <div id="conn-badge" class="badge" title="Сервер">
                    <span class="dot" id="conn-dot"></span> AI
                </div>
            </div>
        </header>

        <main id="views">

            <!-- ── Чат ─────────────────────────────────────── -->
            <section class="view active" id="view-chat">
                <div id="chat"><div id="messages"></div></div>

                <div id="quick-bar">
                    <button class="q-btn" onclick="pcCmd('скриншот')" aria-label="Скриншот">📸</button>
                    <button class="q-btn" onclick="pcCmd('снимок с камеры')" aria-label="Снимок с камеры">📷</button>
                    <button class="q-btn" onclick="pcCmd('стоп')" aria-label="Пауза">⏸</button>
                    <button class="q-btn" onclick="pcCmd('переключи музыку')" aria-label="Следующий трек">⏭</button>
                    <button class="q-btn" onclick="pcCmd('громче')" aria-label="Громче">🔊</button>
                    <button class="q-btn" onclick="pcCmd('тише')" aria-label="Тише">🔉</button>
                    <button class="q-btn" onclick="pcCmd('рабочий стол')" aria-label="Свернуть на рабочий стол">🖥</button>
                    <button class="q-btn" onclick="pcCmd('системная информация')" aria-label="Системная информация">ℹ️</button>
                    <button class="q-btn" onclick="pcCmd('брифинг')" aria-label="Брифинг">📋</button>
                </div>

                <div id="orb-section">
                    <div id="orb" class="idle" role="button" tabindex="0"
                         aria-label="Голосовой ввод: зажми чтобы говорить, тап для режима диалога">
                        <div class="ring r1"></div>
                        <div class="ring r2"></div>
                        <div class="ring r3"></div>
                        <div id="core"></div>
                    </div>
                    <div id="orb-label" aria-live="polite">Нажми чтобы говорить</div>
                </div>

                <div id="input-bar">
                    <input id="text-in" type="text" placeholder="Напиши JARVIS..."
                           autocomplete="off" autocorrect="off" autocapitalize="off">
                    <button id="send-btn" aria-label="Отправить">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </section>

            <!-- ── Сводка (Dashboard) ──────────────────────── -->
            <section class="view" id="view-dashboard">
                <div class="view-body" id="dash-body">
                    <div class="loading">Загрузка…</div>
                </div>
            </section>

            <!-- ── Дела (tasks + reminders) ────────────────── -->
            <section class="view" id="view-tasks">
                <div class="add-row">
                    <input id="task-in" type="text" placeholder="Новая задача или «напомни в 15:00 …»"
                           autocomplete="off">
                    <button class="add-btn" onclick="addTaskOrReminder()">+</button>
                </div>
                <div class="view-body" id="tasks-body">
                    <div class="loading">Загрузка…</div>
                </div>
            </section>

            <!-- ── Привычки ────────────────────────────────── -->
            <section class="view" id="view-habits">
                <div class="add-row">
                    <input id="habit-in" type="text" placeholder="Новая привычка (пить воду, спорт…)"
                           autocomplete="off">
                    <button class="add-btn" onclick="addHabit()">+</button>
                </div>
                <div class="view-body" id="habits-body">
                    <div class="loading">Загрузка…</div>
                </div>
            </section>

            <!-- ── ПК-пульт ────────────────────────────────── -->
            <section class="view" id="view-pc">
                <div class="view-body" id="pc-body">
                    <div class="pc-grid">
                        <button class="pc-tile" onclick="pcCmd('скриншот')"><span>📸</span>Скриншот</button>
                        <button class="pc-tile" onclick="pcCmd('снимок с камеры')"><span>📷</span>Камера</button>
                        <button class="pc-tile" onclick="pcCmd('системная информация')"><span>ℹ️</span>Система</button>
                        <button class="pc-tile" onclick="pcCmd('рабочий стол')"><span>🖥</span>Рабочий стол</button>
                        <button class="pc-tile" onclick="pcCmd('включи музыку')"><span>🎵</span>Музыка</button>
                        <button class="pc-tile" onclick="pcCmd('стоп')"><span>⏸</span>Пауза</button>
                        <button class="pc-tile" onclick="pcCmd('переключи музыку')"><span>⏭</span>Дальше</button>
                        <button class="pc-tile" onclick="pcCmd('предыдущий трек')"><span>⏮</span>Назад</button>
                        <button class="pc-tile" onclick="pcCmd('громче')"><span>🔊</span>Громче</button>
                        <button class="pc-tile" onclick="pcCmd('тише')"><span>🔉</span>Тише</button>
                        <button class="pc-tile" onclick="pcCmd('заблокируй')"><span>🔒</span>Блокировка</button>
                        <button class="pc-tile" onclick="pcCmd('брифинг')"><span>📋</span>Брифинг</button>
                    </div>
                    <div class="pc-hint">Команды уходят на твой ПК, если он онлайн 🟢</div>
                </div>
            </section>

        </main>

        <!-- Bottom tab bar — floating pill, neon active icon + dot indicator -->
        <nav id="tabbar">
            <button class="tab active" data-tab="chat" onclick="switchTab('chat')" aria-label="Чат">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg><i class="dot"></i>
            </button>
            <button class="tab" data-tab="dashboard" onclick="switchTab('dashboard')" aria-label="Сводка">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
                </svg><i class="dot"></i>
            </button>
            <button class="tab" data-tab="tasks" onclick="switchTab('tasks')" aria-label="Дела">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg><i class="dot"></i>
            </button>
            <button class="tab" data-tab="habits" onclick="switchTab('habits')" aria-label="Привычки">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                    <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg><i class="dot"></i>
            </button>
            <button class="tab" data-tab="pc" onclick="switchTab('pc')" aria-label="ПК">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
                </svg><i class="dot"></i>
            </button>
        </nav>

    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
