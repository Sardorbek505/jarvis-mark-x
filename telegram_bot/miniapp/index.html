<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JARVIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <div id="logo">⬡ JARVIS</div>
            <div id="indicators">
                <div id="pc-badge" class="badge" title="Desktop JARVIS">
                    <span class="dot" id="pc-dot"></span> ПК
                </div>
                <div id="conn-badge" class="badge" title="Сервер">
                    <span class="dot" id="conn-dot"></span> AI
                </div>
            </div>
        </header>

        <div id="chat">
            <div id="messages"></div>
        </div>

        <div id="orb-section">
            <div id="orb" class="idle">
                <div class="ring r1"></div>
                <div class="ring r2"></div>
                <div class="ring r3"></div>
                <div id="core"></div>
            </div>
            <div id="orb-label">Нажми чтобы говорить</div>
        </div>

        <div id="input-bar">
            <input id="text-in" type="text" placeholder="Напиши JARVIS..." autocomplete="off" autocorrect="off">
            <button id="send-btn" aria-label="Отправить">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
