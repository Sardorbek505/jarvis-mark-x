# ──────────────────────────────────────────────────────────────────────────────
# JARVIS VPS Stack (то же, что docker-compose.oracle.yml, но ключи — в config/)
#
# Requires:
#   • config/api_keys.json  — Gemini key, Telegram token, Spotify creds
#   • DOMAIN env var        — your domain, e.g. jarvis.yourdomain.com
#
# Quick start:
#   export DOMAIN=jarvis.yourdomain.com
#   docker compose up -d
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Бот (вебхук) + Mini App + PC-мост одним процессом ─────────────────────
  # Раньше бот (polling) и Mini App были отдельными контейнерами — у каждого
  # свой PC-мост: ПК подключался к Mini App, а бот видел «ПК офлайн».
  # Имя сервиса «miniapp» оставлено — на него смотрит Caddyfile.
  miniapp:
    build: .
    image: jarvis-bot
    restart: unless-stopped
    command: >
      python -m uvicorn telegram_bot.render_app:app
      --host 0.0.0.0
      --port 8000
    volumes:
      - ./config:/app/config
      - ./memory:/app/memory
    environment:
      - PYTHONUNBUFFERED=1
      - MINIAPP_URL=https://${DOMAIN}   # отсюда адрес вебхука
    expose:
      - "8000"
    networks:
      - jarvis

  # ── Caddy reverse proxy — automatic HTTPS via Let's Encrypt ────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - jarvis
    depends_on:
      - miniapp

volumes:
  caddy_data:
  caddy_config:

networks:
  jarvis:
    driver: bridge
