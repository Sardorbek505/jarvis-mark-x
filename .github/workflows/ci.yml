name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries
        # pip ставит только Python-обвязку, а нативные библиотеки — нет:
        #   libportaudio2 — под sounddevice, иначе на импорте
        #                   OSError: PortAudio library not found
        #   libegl1/libgl1 — под PyQt6, иначе ImportError: libEGL.so.1
        # Даже с QT_QPA_PLATFORM=offscreen Qt линкуется с EGL при импорте.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1

      - name: Install test dependencies
        # Curated suite is offline (SQLite only) — no Gemini/Telegram/Neon needed.
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        # Ловит то, что тесты пропускают: обращение к несуществующему имени —
        # гарантированный NameError в рантайме. Так в master уехал вызов
        # _send_key() в actions/music_player.py, ронявший основной сценарий
        # запуска музыки, — pytest его не видел, потому что этот путь не покрыт.
        run: python -m ruff check .

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          JARVIS_HEADLESS: "1"
        run: python -m pytest tests/ -q

  wake-word:
    # Слово «Джарвис» на настоящем звуке: голос Edge → настоящая модель Vosk
    # → тот же LocalWake, что в программе. См. scripts/wake_check_vosk.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vosk and edge-tts
        run: pip install vosk edge-tts imageio-ffmpeg
      - name: Download Vosk model
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          mkdir -p models && unzip -q model.zip -d models && mv models/vosk-model-small-ru-0.22 models/vosk-small-ru
      - name: Check wake word on synthesized speech
        run: python scripts/wake_check_vosk.py models/vosk-small-ru
